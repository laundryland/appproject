<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP PROJECT</title>
  
  <!-- Favicon / Icon Tab Browser -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <!-- CSS Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>APP PROJECT</h1>
    <div class="project-selector">
      <label for="projectSelect">Pilih Project:</label>
      <select id="projectSelect" onchange="switchProject()"></select>
      <button class="btn btn-primary" onclick="createNewProject()">+ Project Baru</button>
      <button class="btn btn-danger" onclick="deleteCurrentProject()">Hapus</button>
    </div>
  </header>

  <main class="container">
    <!-- Form Detail Project -->
    <section class="card">
      <h2>Detail Project Active</h2>
      
      <div class="form-group">
        <label>Nama Project:</label>
        <input type="text" id="projectName" oninput="updateProjectData()">
      </div>

      <div class="form-group">
        <label>Folder Project / Path Explorer Local:</label>
        <input type="text" id="projectFolder" placeholder="C:\Projects\MyApp atau /home/user/app" oninput="updateProjectData()">
      </div>

      <div class="form-group">
        <label>URL Hosting / Live Project:</label>
        <input type="url" id="projectHostingUrl" placeholder="https://myproject.github.io" oninput="updateProjectData()">
        <button class="btn btn-secondary btn-sm" onclick="openUrl('projectHostingUrl')">Buka URL Hosting</button>
      </div>

      <div class="form-group">
        <label>Multi-URL Tab (Satu URL per baris):</label>
        <textarea id="projectUrls" rows="3" placeholder="https://github.com/user/repo&#10;https://figma.com/file/xyz" oninput="updateProjectData()"></textarea>
        <button class="btn btn-success" onclick="openAllUrls()">🚀 Buka Semua Tab URL</button>
      </div>

      <div class="form-group">
        <label>Catatan Kendala & Bahan App:</label>
        <textarea id="projectNotes" rows="5" placeholder="Copas kendala error, snippet kode, atau instruksi di sini..." oninput="updateProjectData()"></textarea>
      </div>
    </section>

    <!-- Cloud & Local Backup -->
    <section class="card">
      <h2>Backup & Restore Data</h2>
      
      <div class="form-group">
        <label>URL Cloud Backup (Endpoint API):</label>
        <input type="url" id="cloudUrl" placeholder="https://api.jsonbin.io/v3/b/..." oninput="saveCloudUrlData()">
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="syncToCloud()">☁️ Eksekusi Backup Cloud</button>
        <button class="btn btn-secondary" onclick="exportLocalBackup()">💾 Download Backup Lokal (.json)</button>
        
        <label class="btn btn-info custom-file-upload">
          📂 Restore Backup Lokal
          <input type="file" id="importFile" accept=".json" onchange="importLocalBackup(event)">
        </label>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
