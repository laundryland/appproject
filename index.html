<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP PROJECT</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <!-- Bootstrap 5 CSS & FontAwesome Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .form-control, .form-select { background-color: #0f172a; color: #f8fafc; border: 1px solid #334155; }
    .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #3b82f6; box-shadow: none; }
    .draggable-card { cursor: move; }
    .draggable-card.dragging { opacity: 0.5; border: 2px dashed #3b82f6; }
    .btn-primary { background-color: #3b82f6; border: none; }
    .btn-primary:hover { background-color: #2563eb; }
  </style>
</head>
<body>

<div class="container py-4">
  <!-- Header & Project Selector -->
  <div class="card card-custom p-3 mb-4 shadow">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <h3 class="m-0 fw-bold text-primary"><i class="fa-solid fa-cubes me-2"></i>APP PROJECT</h3>
      </div>
      <div class="col-md-5">
        <div class="input-group">
          <label class="input-group-text bg-dark text-white border-secondary">Project:</label>
          <select id="projectSelect" class="form-select" onchange="switchProject()"></select>
          <button class="btn btn-outline-success" onclick="createProject()"><i class="fa-solid fa-plus"></i> Baru</button>
          <button class="btn btn-outline-danger" onclick="deleteProject()"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <div class="col-md-3 text-end">
        <button class="btn btn-sm btn-outline-light me-1" onclick="exportData()"><i class="fa-solid fa-download"></i> Backup</button>
        <button class="btn btn-sm btn-outline-light" onclick="document.getElementById('fileImport').click()"><i class="fa-solid fa-upload"></i> Import</button>
        <input type="file" id="fileImport" style="display:none" onchange="importData(event)">
      </div>
    </div>
  </div>

  <!-- Action Bar: Tambah Kolom & Quick Exec -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="text-secondary m-0">Daftar Komponen & Material Project</h5>
    <button class="btn btn-primary" onclick="addCard()"><i class="fa-solid fa-plus-circle me-1"></i> Tambah Kolom</button>
  </div>

  <!-- Dynamic Cards Container (Drag & Drop Supported) -->
  <div id="cardsContainer" class="row g-3"></div>

  <!-- Backup & Cloud Settings Section -->
  <div class="card card-custom p-3 mt-5">
    <h5 class="text-primary mb-3"><i class="fa-solid fa-cloud-arrow-up me-2"></i>Pengaturan Backup & Sync Cloud</h5>
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label text-muted small">URL Endpoint Cloud Backup (REST API / Webhook):</label>
        <input type="url" id="cloudUrl" class="form-control" placeholder="https://api.jsonbin.io/v3/b/YOUR_BIN_ID" onchange="saveCloudUrl()">
      </div>
      <div class="col-md-4 d-flex align-items-end gap-2">
        <button class="btn btn-outline-primary w-100" onclick="uploadToCloud()"><i class="fa-solid fa-cloud-arrow-up me-1"></i> Upload Cloud</button>
        <button class="btn btn-outline-warning w-100" onclick="downloadFromCloud()"><i class="fa-solid fa-cloud-arrow-down me-1"></i> Sync Local</button>
      </div>
    </div>
  </div>
</div>

<script>
// Registered PWA Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => console.log("PWA SW Ready"));
}

// Initial Data Structure
let appData = JSON.parse(localStorage.getItem('APP_PROJECT_DATA')) || {
  activeProject: "Default Project",
  cloudUrl: "",
  projects: {
    "Default Project": [
      { id: 1, title: "Browser Default (Multi-Tab URL)", type: "urls", content: "https://github.com\nhttps://google.com" },
      { id: 2, title: "Folder Project (Local Path)", type: "text", content: "D:\\Projects\\AppProject" },
      { id: 3, title: "URL Hosting", type: "url", content: "https://my-app.github.io" },
      { id: 4, title: "Catatan & Kendala Log", type: "textarea", content: "Error CORS saat fetch API local.\nSolusi: pasang header Access-Control-Allow-Origin." }
    ]
  }
};

let currentProject = appData.activeProject || Object.keys(appData.projects)[0];

function saveData() {
  appData.activeProject = currentProject;
  localStorage.setItem('APP_PROJECT_DATA', JSON.stringify(appData));
}

function init() {
  document.getElementById('cloudUrl').value = appData.cloudUrl || '';
  renderProjectDropdown();
  renderCards();
}

function renderProjectDropdown() {
  const select = document.getElementById('projectSelect');
  select.innerHTML = '';
  Object.keys(appData.projects).forEach(proj => {
    const opt = document.createElement('option');
    opt.value = proj;
    opt.innerText = proj;
    if (proj === currentProject) opt.selected = true;
    select.appendChild(opt);
  });
}

function switchProject() {
  currentProject = document.getElementById('projectSelect').value;
  saveData();
  renderCards();
}

function createProject() {
  const name = prompt("Masukkan Nama Project Baru:");
  if (name && !appData.projects[name]) {
    appData.projects[name] = [];
    currentProject = name;
    saveData();
    renderProjectDropdown();
    renderCards();
  }
}

function deleteProject() {
  const keys = Object.keys(appData.projects);
  if (keys.length <= 1) {
    alert("Minimal harus ada 1 project!");
    return;
  }
  if (confirm(`Yakin ingin menghapus project "${currentProject}"?`)) {
    delete appData.projects[currentProject];
    currentProject = Object.keys(appData.projects)[0];
    saveData();
    renderProjectDropdown();
    renderCards();
  }
}

function renderCards() {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';
  const cards = appData.projects[currentProject] || [];

  cards.forEach((card, index) => {
    const col = document.createElement('div');
    col.className = 'col-md-6 col-lg-4 draggable-card';
    col.draggable = true;
    col.dataset.index = index;

    let bodyHTML = '';
    if (card.type === 'urls') {
      bodyHTML = `
        <textarea class="form-control mb-2" rows="3" placeholder="Satu URL per baris" onchange="updateCardContent(${card.id}, this.value)">${card.content}</textarea>
        <button class="btn btn-sm btn-success w-100" onclick="openMultiTabs('${card.id}')"><i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Buka Semua Tab</button>
      `;
    } else if (card.type === 'textarea') {
      bodyHTML = `
        <textarea class="form-control mb-2" rows="4" placeholder="Tulis catatan/kendala..." onchange="updateCardContent(${card.id}, this.value)">${card.content}</textarea>
        <button class="btn btn-sm btn-outline-light w-100" onclick="copyText('${card.id}')"><i class="fa-regular fa-copy me-1"></i> Copy Catatan</button>
      `;
    } else if (card.type === 'url') {
      bodyHTML = `
        <input type="url" class="form-control mb-2" value="${card.content}" placeholder="https://..." onchange="updateCardContent(${card.id}, this.value)">
        <a href="${card.content}" target="_blank" class="btn btn-sm btn-outline-info w-100"><i class="fa-solid fa-link me-1"></i> Buka Link</a>
      `;
    } else {
      bodyHTML = `
        <input type="text" id="input-${card.id}" class="form-control mb-2" value="${card.content}" placeholder="Folder Path / Text" onchange="updateCardContent(${card.id}, this.value)">
        <button class="btn btn-sm btn-outline-secondary w-100" onclick="copyInput('${card.id}')"><i class="fa-regular fa-copy me-1"></i> Copy Path/Text</button>
      `;
    }

    col.innerHTML = `
      <div class="card card-custom h-100 p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="badge bg-secondary"><i class="fa-solid fa-grip-vertical me-1"></i> Drag</span>
          <input type="text" class="form-control form-control-sm border-0 fw-bold bg-transparent text-white w-50" value="${card.title}" onchange="updateCardTitle(${card.id}, this.value)">
          <div>
            <button class="btn btn-sm text-danger" onclick="removeCard(${card.id})"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
        ${bodyHTML}
      </div>
    `;

    // Drag and Drop Events
    col.addEventListener('dragstart', handleDragStart);
    col.addEventListener('dragover', handleDragOver);
    col.addEventListener('drop', handleDrop);
    col.addEventListener('dragend', handleDragEnd);

    container.appendChild(col);
  });
}

function addCard() {
  const type = prompt("Pilih tipe kolom:\n1. Open Multi-URL (Browser)\n2. Path/Folder (Text)\n3. URL Hosting\n4. Catatan (Textarea)\n\nMasukkan angka (1-4):", "1");
  let cardType = "urls";
  let title = "Komponen Baru";

  if (type === "2") { cardType = "text"; title = "Folder Project"; }
  else if (type === "3") { cardType = "url"; title = "URL Hosting"; }
  else if (type === "4") { cardType = "textarea"; title = "Catatan Kendala"; }

  const newCard = { id: Date.now(), title, type: cardType, content: "" };
  appData.projects[currentProject].push(newCard);
  saveData();
  renderCards();
}

function removeCard(id) {
  appData.projects[currentProject] = appData.projects[currentProject].filter(c => c.id !== id);
  saveData();
  renderCards();
}

function updateCardTitle(id, value) {
  const card = appData.projects[currentProject].find(c => c.id === id);
  if (card) { card.title = value; saveData(); }
}

function updateCardContent(id, value) {
  const card = appData.projects[currentProject].find(c => c.id === id);
  if (card) { card.content = value; saveData(); }
}

function openMultiTabs(id) {
  const card = appData.projects[currentProject].find(c => c.id === id);
  if (card && card.content) {
    const urls = card.content.split('\n').map(u => u.trim()).filter(u => u !== '');
    if (urls.length === 0) return alert("Isikan URL terlebih dahulu!");
    urls.forEach(url => {
      let formattedUrl = url.startsWith('http') ? url : 'http://' + url;
      window.open(formattedUrl, '_blank');
    });
  }
}

function copyText(id) {
  const card = appData.projects[currentProject].find(c => c.id === id);
  if (card) {
    navigator.clipboard.writeText(card.content);
    alert("Catatan berhasil disalin!");
  }
}

function copyInput(id) {
  const input = document.getElementById(`input-${id}`);
  if (input) {
    navigator.clipboard.writeText(input.value);
    alert("Teks/Path berhasil disalin!");
  }
}

// Drag and Drop Logic
let dragSrcIndex = null;
function handleDragStart(e) {
  this.classList.add('dragging');
  dragSrcIndex = Number(this.dataset.index);
  e.dataTransfer.effectAllowed = 'move';
}
function handleDragOver(e) {
  if (e.preventDefault) e.preventDefault();
  return false;
}
function handleDrop(e) {
  e.stopPropagation();
  const targetIndex = Number(this.dataset.index);
  if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
    const list = appData.projects[currentProject];
    const movedItem = list.splice(dragSrcIndex, 1)[0];
    list.splice(targetIndex, 0, movedItem);
    saveData();
    renderCards();
  }
  return false;
}
function handleDragEnd() {
  this.classList.remove('dragging');
}

// Backup Local
function exportData() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
  const downloadAnchor = document.createElement('a');
  downloadAnchor.setAttribute("href", dataStr);
  downloadAnchor.setAttribute("download", `APP_PROJECT_BACKUP_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  downloadAnchor.remove();
}

function importData(e) {
  const fileReader = new FileReader();
  fileReader.onload = function(event) {
    try {
      appData = JSON.parse(event.target.result);
      currentProject = appData.activeProject || Object.keys(appData.projects)[0];
      saveData();
      init();
      alert("Import data berhasil!");
    } catch (err) {
      alert("File JSON tidak valid!");
    }
  };
  fileReader.readAsText(e.target.files[0]);
}

// Cloud Backup
function saveCloudUrl() {
  appData.cloudUrl = document.getElementById('cloudUrl').value;
  saveData();
}

async function uploadToCloud() {
  if (!appData.cloudUrl) return alert("Isikan URL Cloud terlebih dahulu!");
  try {
    const response = await fetch(appData.cloudUrl, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(appData)
    });
    if (response.ok) alert("Data berhasil di-upload ke Cloud!");
    else alert("Gagal mengunggah data ke Cloud.");
  } catch (err) {
    alert("Terjadi kesalahan koneksi saat upload.");
  }
}

async function downloadFromCloud() {
  if (!appData.cloudUrl) return alert("Isikan URL Cloud terlebih dahulu!");
  try {
    const response = await fetch(appData.cloudUrl);
    if (response.ok) {
      const result = await response.json();
      appData = result.record || result;
      currentProject = appData.activeProject || Object.keys(appData.projects)[0];
      saveData();
      init();
      alert("Data berhasil disinkronisasi dari Cloud!");
    } else alert("Gagal mengambil data dari Cloud.");
  } catch (err) {
    alert("Terjadi kesalahan koneksi saat download.");
  }
}

window.onload = init;
</script>
</body>
</html>
