<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APP PROJECT</title>
  
  <!-- Favicon / Icon Tab Browser -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <!-- CSS Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>APP PROJECT</h1>
    <div class="project-selector">
      <label for="projectSelect">Pilih Project:</label>
      <select id="projectSelect" onchange="switchProject()"></select>
      <button class="btn btn-primary" onclick="createNewProject()">+ Project Baru</button>
      <button class="btn btn-danger" onclick="deleteCurrentProject()">Hapus</button>
    </div>
  </header>

  <main class="container">
    <!-- Section Project Active -->
    <section class="card">
      <div class="card-header">
        <h2>Detail Project Active</h2>
        <button class="btn btn-success" onclick="executeAllUrls()">🚀 Buka Semua URL Serentak</button>
      </div>

      <div class="form-group margin-bottom-lg">
        <label>Nama Project:</label>
        <input type="text" id="projectName" oninput="updateProjectName()">
      </div>

      <hr class="divider">

      <!-- Dynamic Items Header -->
      <div class="card-header">
        <h3>Daftar Link URL / Path Folder / Bahan Project</h3>
        <button class="btn btn-primary btn-sm" onclick="addDynamicItem()">+ Tambah Kolom Item</button>
      </div>

      <!-- Container untuk Kolom Dinamis -->
      <div id="dynamicItemsContainer" class="items-container"></div>
    </section>

    <!-- Cloud & Local Backup -->
    <section class="card">
      <h2>Backup & Restore Data</h2>
      
      <div class="form-group">
        <label>URL Cloud Backup (Endpoint API):</label>
        <input type="url" id="cloudUrl" placeholder="https://api.jsonbin.io/v3/b/..." oninput="saveCloudUrlData()">
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="syncToCloud()">☁️ Eksekusi Backup Cloud</button>
        <button class="btn btn-secondary" onclick="exportLocalBackup()">💾 Download Backup Lokal (.json)</button>
        
        <label class="btn btn-info custom-file-upload">
          📂 Restore Backup Lokal
          <input type="file" id="importFile" accept=".json" onchange="importLocalBackup(event)">
        </label>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
